name: Update WAProto

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate current WhatsApp proto
        run: npm run build

  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build latest WhatsApp proto
        run: npm run build
        env:
          WA_COMMIT: true

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "detected=false" >> "${GITHUB_OUTPUT}"
          else
            echo "detected=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Commit and release update
        if: steps.changes.outputs.detected == 'true'
        shell: bash
        run: |
          version=$(grep "WhatsApp Version" WAProto.proto | cut -d":" -f2 | xargs)
          git add WAProto.proto dist/index.js dist/index.d.ts
          git commit -m "Update WAProto.proto to ${version}"
          git push origin HEAD:main
          npx release-it --increment "${version}" --ci
